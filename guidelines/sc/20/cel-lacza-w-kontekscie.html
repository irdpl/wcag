<section id="cel-lacza-w-kontekscie" class="sc">
   
   <h4>Cel łącza (w kontekście)</h4>
   
   <p class="conformance-level">A</p>
   
   <p><a>Cel każdego łącza</a> można określić na podstawie samego tekstu łącza lub tekstu łącza wraz z <a>programowo określonym kontekstem łącza</a>, poza tymi przypadkami, kiedy cel łącza i tak byłby <a>niejednoznaczny dla użytkowników</a>.
   </p>
   
</section>
